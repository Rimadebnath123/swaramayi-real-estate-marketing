# Swaramayi Real Estate CRM & Website - Native Nginx Configuration (No Docker)
# Place this at: /etc/nginx/sites-available/swaramayi
# Symlinked to: /etc/nginx/sites-enabled/swaramayi

# 1. CRM SUBDOMAIN (crm.swaramayi.info)
server {
    server_name crm.swaramayi.info crm.swaramayi.com;

    root /var/www/swaramayi/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.swaramayi.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.swaramayi.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. CRM DIRECT PORT 3000 (Allows accessing CRM via http://<EC2-IP>:3000)
server {
    listen 3000;
    server_name _;

    root /var/www/swaramayi/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. MAIN PUBLIC WEBSITE & DEFAULT SERVER (swaramayi.info, www, or raw EC2 IP on port 80)
server {
    listen 80 default_server;
    server_name swaramayi.info www.swaramayi.info swaramayi.com www.swaramayi.com localhost _;

    root /var/www/swaramayi/website-frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy for Public Website
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM path alias (allows accessing CRM via http://<IP>/crm/)
    location /crm/ {
        alias /var/www/swaramayi/frontend/dist/;
        try_files $uri $uri/ /crm/index.html;
    }

    # Public Website Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    server_name web.swaramayi.info;

    root /var/www/swaramayi/website-frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy for Public Website
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM path alias (allows accessing CRM via http://<IP>/crm/)
    location /crm/ {
        alias /var/www/swaramayi/frontend/dist/;
        try_files $uri $uri/ /crm/index.html;
    }

    # Public Website Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/web.swaramayi.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.swaramayi.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = web.swaramayi.info) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name web.swaramayi.info;
    return 404;
}

server {
    if ($host = crm.swaramayi.info) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name crm.swaramayi.info crm.swaramayi.com;
    return 404;
}
