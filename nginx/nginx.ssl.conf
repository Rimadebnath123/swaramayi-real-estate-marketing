# Swaramayi Production Gateway Nginx SSL Configuration
# Full HTTPS enabled configuration for swaramayi.com and crm.swaramayi.com

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream backend_service {
    server backend:5000;
    keepalive 32;
}

upstream crm_service {
    server crm-frontend:80;
    keepalive 32;
}

upstream website_service {
    server website-frontend:80;
    keepalive 32;
}

# 1. HTTP Redirect to HTTPS (All traffic)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. CRM SUBDOMAIN (crm.swaramayi.com) - HTTPS
server {
    listen 443 ssl http2;
    server_name crm.swaramayi.com;

    ssl_certificate /etc/letsencrypt/live/swaramayi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swaramayi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Backend API Proxy for CRM
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        limit_req zone=api_limit burst=50 nodelay;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM UI
    location / {
        proxy_pass http://crm_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 3. PUBLIC WEBSITE (swaramayi.com, www.swaramayi.com) - HTTPS
server {
    listen 443 ssl http2 default_server;
    server_name swaramayi.com www.swaramayi.com;

    ssl_certificate /etc/letsencrypt/live/swaramayi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swaramayi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=api_limit burst=50 nodelay;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM fallback alias
    location /crm/ {
        proxy_pass http://crm_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public Website UI
    location / {
        proxy_pass http://website_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
