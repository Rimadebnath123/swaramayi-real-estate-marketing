# Swaramayi Real Estate CRM & Website - Native Nginx Configuration (No Docker)
# Place this at: /etc/nginx/sites-available/swaramayi
# Symlinked to: /etc/nginx/sites-enabled/swaramayi

# 1. CRM SUBDOMAIN (crm.swaramayi.com)
server {
    listen 80;
    server_name crm.swaramayi.com;

    root /var/www/swaramayi/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. CRM DIRECT PORT 3000 (Allows accessing CRM via http://<EC2-IP>:3000)
server {
    listen 3000;
    server_name _;

    root /var/www/swaramayi/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. MAIN PUBLIC WEBSITE & DEFAULT SERVER (swaramayi.com, www, or raw EC2 IP on port 80)
server {
    listen 80 default_server;
    server_name swaramayi.com www.swaramayi.com localhost _;

    root /var/www/swaramayi/website-frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Backend API Proxy for Public Website
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM path alias (allows accessing CRM via http://<IP>/crm/)
    location /crm/ {
        alias /var/www/swaramayi/frontend/dist/;
        try_files $uri $uri/ /crm/index.html;
    }

    # Public Website Single Page App Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
