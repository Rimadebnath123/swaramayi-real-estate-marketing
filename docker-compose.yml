version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swaramayi-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://avishekdas075_db_user:11to1FBkkfSvKsse@cluster0.fathkrm.mongodb.net/swaramayi_crm?retryWrites=true&w=majority}
      - JWT_SECRET=${JWT_SECRET:-swaramayi_crm_super_secret_jwt_key_2026_production_ready}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - swaramayi-network

  crm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: swaramayi-crm-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - swaramayi-network
    depends_on:
      - backend

  website-frontend:
    build:
      context: ./website-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1/public
    container_name: swaramayi-website-frontend
    restart: always
    ports:
      - "5001:80"
    networks:
      - swaramayi-network
    depends_on:
      - backend

  nginx-proxy:
    image: nginx:alpine
    container_name: swaramayi-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - crm-frontend
      - website-frontend
    networks:
      - swaramayi-network

  certbot:
    image: certbot/certbot:latest
    container_name: swaramayi-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - swaramayi-network

volumes:
  backend_uploads:
  certbot_conf:
  certbot_www:

networks:
  swaramayi-network:
    driver: bridge
