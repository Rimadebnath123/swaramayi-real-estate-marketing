# Swaramayi Production Gateway Nginx Reverse Proxy Configuration
# Routes traffic to Public Website, CRM Dashboard, and Backend API

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Upstream definitions
upstream backend_service {
    server backend:5000;
    keepalive 32;
}

upstream crm_service {
    server crm-frontend:80;
    keepalive 32;
}

upstream website_service {
    server website-frontend:80;
    keepalive 32;
}

# 1. CRM SUBDOMAIN SERVER (e.g., crm.swaramayi.com)
server {
    listen 80;
    server_name crm.swaramayi.com crm.*;

    client_max_body_size 25M;

    # Certbot ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy for CRM
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        limit_req zone=api_limit burst=50 nodelay;
    }

    # Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM Dashboard Frontend
    location / {
        proxy_pass http://crm_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. API SUBDOMAIN SERVER (e.g., api.swaramayi.com)
server {
    listen 80;
    server_name api.swaramayi.com api.*;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=50 nodelay;
    }
}

# 3. PRIMARY WEBSITE & DEFAULT SERVER (IP or swaramayi.com / www.swaramayi.com)
server {
    listen 80 default_server;
    server_name swaramayi.com www.swaramayi.com localhost _;

    client_max_body_size 25M;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy for Public Website and general requests
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=api_limit burst=50 nodelay;
    }

    # Static Uploads Proxy
    location /uploads/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM route alias (in case accessed via /crm on the main domain)
    location /crm/ {
        proxy_pass http://crm_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Website UI
    location / {
        proxy_pass http://website_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
